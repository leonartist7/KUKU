name: Beta HTTP probes
on:
  pull_request:
    paths: ['.github/workflows/beta-probes.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify existing beta with unauthenticated GET requests only
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, time, urllib.request, urllib.error
          from datetime import datetime, timezone
          API = "https://kuku-api-staging.onrender.com"
          BETA = "https://kuku-git-codex-kuku-release-20261027-lionovart.vercel.app"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          checks = [
              ("live", API + "/health/live", 200, "health"),
              ("ready", API + "/health/ready", 200, "health"),
              ("private account", API + "/api/auth/me", 401, "private-direct"),
              ("private chats", API + "/api/chats", 401, "private-direct"),
              ("public sign-in", BETA + "/login", 200, "html"),
              ("beta proxy", BETA + "/api/auth/me", 401, "private-proxy"),
          ]
          results, issues = [], []
          for label, url, expected, kind in checks:
              started = time.perf_counter()
              row = {"check": label, "url": url, "expected": expected}
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "KUKU-release-probe/1", "Origin": BETA})
                  try:
                      response = opener.open(req, timeout=95)
                  except urllib.error.HTTPError as error:
                      response = error
                  with response:
                      status, headers = response.code, response.headers
                      body = response.read(2049)
                  row.update(status=status, cache_control=headers.get("Cache-Control", ""),
                             content_type=headers.get("Content-Type", ""),
                             allow_origin=headers.get("Access-Control-Allow-Origin", ""))
                  if status != expected:
                      issues.append(label + ": unexpected HTTP status " + str(status))
                  if kind == "health":
                      row["healthy"] = status == 200 and json.loads(body).get("ok") is True
                      if not row["healthy"]: issues.append(label + ": readiness body failed")
                  if kind.startswith("private") and "no-store" not in row["cache_control"].lower():
                      issues.append(label + ": private response must be no-store")
                  if kind == "private-direct" and row["allow_origin"] != BETA:
                      issues.append(label + ": existing beta origin is not approved")
                  if kind == "html" and "text/html" not in row["content_type"]:
                      issues.append(label + ": expected the sign-in document")
              except Exception as error:
                  row["error"] = type(error).__name__
                  issues.append(label + ": " + type(error).__name__)
              row["elapsed_ms"] = round((time.perf_counter() - started) * 1000)
              results.append(row)
              print(json.dumps(row))
          report = {"checked_at": datetime.now(timezone.utc).isoformat(), "results": results, "issues": issues,
                    "scope": "Only unauthenticated GETs; no accounts, messages, uploads, notifications or data changes.",
                    "performance_note": "Individual direct HTTP samples, not cold-start, browser or percentile benchmarks."}
          pathlib.Path("test-results").mkdir(exist_ok=True)
          pathlib.Path("test-results/beta-http-probes.json").write_text(json.dumps(report, indent=2) + "\n")
          if issues: raise SystemExit("; ".join(issues))
          print("Beta HTTP readiness passed: health, private-route rejection, cache policy, approved origin, sign-in and proxy.")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kuku-beta-http-probes
          path: test-results/beta-http-probes.json
          if-no-files-found: error
          retention-days: 7
